[package]
name = "capa"
version = "0.5.2"
description = "File capability extractor."
authors = ["Marirs <marirs@gmail.com>", "Andrey Mnatsakanov <andrey@3ig.kiev.ua>", "Jorge Alejandro Durán Royo<jorge.duran.royo@gmail.com>"]
keywords = ["capa", "fce", "capability", "aslr", "reverse"]
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/marirs/capa-rs"
homepage = "https://github.com/marirs/capa-rs"
exclude = ["data", "flirt-sigs", "scripts"]
edition = "2024"
rust-version = "1.95"

[dependencies]
hex = "0.4.3"
itertools = "0.14.0"
pdb = "0.8.0"
petgraph = "0.8"
regex = "1.11.1"
fancy-regex = "0.18"
serde = { version = "1", features = ["derive"] }
smda = "0.6.5"
thiserror = "2.0.12"
walkdir = "2.5.0"
yaml-rust = "0.4.5"
goblin = { version = "0.10.0", features = ["alloc"] }
maplit = "1.0.2"
dnfile = "0.5"
lazy_static = "1.5.0"
parking_lot = "0.12.3"
serde_json = "1.0.140"
memoffset = "0.9.1"
memmap2 = "0.9.5"
scroll = "0.13"
once_cell = "1.21.1"
dynamic-loader-cache = "0.2.2"
plist = { version = "1", default-features = false }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
rayon = "1.10"

[dev-dependencies]
clap = { version = "4.5", features = ["cargo", "derive"] }
prettytable-rs = "0.10.0"

[lib]
name = "capa"
path = "src/lib.rs"

[features]
default = ["properties"]
verbose = []
properties = []

[[example]]
name = "capa_cli"
path = "examples/capa_cli.rs"
required-features = ["properties"]

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
debug-assertions = false
debug = false
opt-level = 3
lto = true
